<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f6f2">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%23f8f6f2'/%3E%3Cpath d='M9 34V16a11 11 0 0 1 22 0v18H9Z' fill='none' stroke='%23883e4a' stroke-width='2'/%3E%3Cpath d='M20 19c-7-5-10 4 0 9 10-5 7-14 0-9Z' fill='%23883e4a'/%3E%3C/svg%3E">
  <title>暂时休馆 · 我们之间</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f8f6f2;
      --ink: #302c29;
      --muted: #756e65;
      --accent: #883e4a;
      --line: #dfd9d0;
      --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
      --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 280px;
      min-height: 100vh;
      min-height: 100svh;
      padding: 0 64px;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      color: var(--ink);
      font: 14px/1.8 var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      opacity: .22;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.72' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23756e65' opacity='.12' filter='url(%23n)' d='M0 0h160v160H0z'/%3E%3C/svg%3E");
    }
    ::selection { background: #ead8da; }
    .masthead, .footer, .exhibition { width: 100%; max-width: 1160px; margin-inline: auto; }
    .masthead {
      min-height: 110px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .brand { display: flex; gap: 14px; align-items: center; }
    .brand-mark { width: 36px; height: 42px; color: var(--accent); flex-shrink: 0; }
    .brand-name { margin: 0; font: 600 22px/1.4 var(--serif); letter-spacing: .15em; }
    .brand-caption { margin: 3px 0 0; color: var(--muted); font-size: 10px; letter-spacing: .24em; }
    .edition { color: var(--muted); font-size: 10px; letter-spacing: .2em; text-align: right; }
    .edition span { display: block; margin-top: 2px; font-size: 11px; letter-spacing: .14em; }

    main { flex: 1; display: flex; align-items: center; padding: 72px 0 80px; }
    .exhibition { display: grid; grid-template-columns: 1fr 1fr; gap: 38px; align-items: center; }
    .notice { position: relative; z-index: 1; }
    .eyebrow { display: flex; align-items: center; gap: 10px; margin: 0 0 30px; font-size: 12px; letter-spacing: .16em; color: var(--accent); }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px #883e4a0b; }
    h1 { margin: 0; font: 500 clamp(36px, 3.5vw, 52px)/1.65 var(--serif); letter-spacing: -.025em; }
    h1 span { display: block; }
    h1 em { font-style: normal; color: var(--accent); }
    .description { margin: 25px 0 0; color: var(--muted); font-size: 14px; line-height: 2.1; }
    .description span { display: block; }
    .retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
      min-height: 50px;
      padding: 12px 23px;
      margin-top: 32px;
      background: var(--accent);
      color: #fffcf7;
      border: 1px solid var(--accent);
      border-radius: 3px;
      font-size: 13px;
      letter-spacing: .1em;
      text-decoration: none;
      transition: background .2s, transform .2s;
    }
    .retry svg { width: 17px; height: 17px; flex-shrink: 0; }
    .retry:hover { background: #72303b; transform: translateY(-2px); }
    .retry:active { transform: translateY(0); }
    .retry:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    .action-note { margin: 12px 0 0; color: var(--muted); font-size: 11px; letter-spacing: .025em; }
    .divider { width: 32px; height: 1px; background: #b9a38f; margin: 35px 0 19px; }
    .closing { margin: 0; font: 14px/1.8 var(--serif); color: #6c635b; letter-spacing: .1em; }

    .artwork { position: relative; margin: 0; width: 100%; max-width: 560px; justify-self: center; }
    .artwork svg { display: block; width: 100%; height: auto; overflow: visible; }
    .artwork figcaption { text-align: center; color: #756e65; font: italic 14px/1.8 Georgia, var(--serif); letter-spacing: .04em; margin-top: 3px; }
    .artwork figcaption span { display: inline-block; width: 23px; height: 1px; background: #c4b6a5; vertical-align: middle; margin: 0 13px; }
    .footer { border-top: 1px solid var(--line); min-height: 76px; display: flex; justify-content: space-between; align-items: center; gap: 20px; color: var(--muted); font-size: 11px; letter-spacing: .06em; }
    .footer p { margin: 0; }
    .footer-english { font: italic 12px/1.8 Georgia, serif; letter-spacing: .04em; }
    .small-heart { color: var(--accent); margin: 0 5px; }

    @media (min-width: 901px) and (min-height: 850px) {
      main { padding-block: 90px 110px; }
    }
    @media (max-width: 1100px) {
      body { padding-inline: 40px; }
      .exhibition { gap: 18px; }
    }
    @media (max-width: 900px) {
      body { padding-inline: 32px; }
      .masthead { min-height: 90px; }
      main { padding: 46px 0; }
      .exhibition { max-width: 560px; grid-template-columns: 1fr; gap: 14px; }
      .notice { text-align: center; }
      .eyebrow { justify-content: center; margin-bottom: 19px; }
      h1 { font-size: 40px; line-height: 1.6; }
      .description { margin-top: 20px; }
      .retry { margin-top: 25px; }
      .divider { margin: 25px auto 13px; }
      .artwork { max-width: 410px; margin-top: 0; }
      .footer { min-height: 80px; }
    }
    @media (max-width: 480px) {
      body { padding-inline: 24px; }
      .masthead { min-height: 83px; gap: 10px; }
      .brand { gap: 9px; }
      .brand-mark { width: 28px; height: 34px; }
      .brand-name { font-size: 19px; }
      .brand-caption { font-size: 8px; letter-spacing: .15em; }
      .edition { font-size: 8px; letter-spacing: .12em; }
      .edition span { font-size: 10px; letter-spacing: .06em; }
      main { padding: 37px 0 30px; }
      h1 { font-size: clamp(26px, 7.9vw, 36px); line-height: 1.65; letter-spacing: -.04em; }
      .eyebrow { font-size: 11px; margin-bottom: 20px; }
      .description { font-size: 12px; margin-top: 17px; }
      .retry { min-height: 48px; margin-top: 23px; padding: 10px 23px; }
      .action-note { font-size: 10px; }
      .divider { margin-block: 24px 14px; }
      .closing { font-size: 12px; }
      .exhibition { gap: 4px; }
      .artwork { max-width: 320px; }
      .artwork figcaption { font-size: 12px; margin-top: -5px; }
      .footer { min-height: 83px; padding-block: 17px; flex-direction: column; justify-content: center; gap: 3px; font-size: 10px; }
      .footer-english { font-size: 11px; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .notice { animation: arrive .7s ease-out both; }
      .artwork { animation: arrive .9s .1s ease-out both; }
      @keyframes arrive { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    }
    @media (prefers-reduced-motion: reduce) { .retry { transition: none; } }
    @media (forced-colors: active) { .retry { border-color: ButtonText; } }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 36 42" fill="none" aria-hidden="true">
        <path d="M3 38V17a13 13 0 0 1 26 0v21H3Z" stroke="currentColor" stroke-width="1.5"/>
        <path d="M9 38V21a12 12 0 0 1 24 0v17H9Z" stroke="currentColor" stroke-width="1.5"/>
        <path d="M17 25c-4-3-6 2 0 5 6-3 4-8 0-5Z" fill="currentColor"/>
      </svg>
      <div>
        <p class="brand-name">我们之间</p>
        <p class="brand-caption">A GALLERY OF OUR DAYS</p>
      </div>
    </div>
    <div class="edition">GALLERY NOTICE<span>生活画廊 · 维护手记</span></div>
  </header>

  <main>
    <section class="exhibition" aria-labelledby="notice-title">
      <div class="notice">
        <p class="eyebrow"><span class="status-dot" aria-hidden="true"></span>生活画廊 · 暂时休馆</p>
        <h1 id="notice-title"><span>给我们的时光，</span><span>做一点<em>小小的整理。</em></span></h1>
        <p class="description"><span>网站正在维护，暂时无法访问。</span><span>请稍后再来，继续收藏我们的日常。</span></p>
        <!-- 回到站点入口重新判断维护状态；关闭维护后即可正常进入。 -->
        <a class="retry" href="/">
          再试一次
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 8a8 8 0 1 0 1 7M19 3v5h-5"/></svg>
        </a>
        <p class="action-note">若仍在维护中，请过一会儿再来。</p>
        <div class="divider" aria-hidden="true"></div>
        <p class="closing">故事只是暂停，下一页依然是我们。</p>
      </div>

      <figure class="artwork">
        <svg viewBox="0 0 560 500" fill="none" role="img" aria-labelledby="art-title art-desc">
          <title id="art-title">正在整理的生活画廊</title>
          <desc id="art-desc">两张叠放的风景相纸、一把画笔和暂时休馆的小纸条，等待下一次相见。</desc>
          <defs>
            <filter id="paper-shadow" x="-40%" y="-30%" width="180%" height="180%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5a4736" flood-opacity=".10"/></filter>
            <linearGradient id="sky" x1="100" y1="100" x2="340" y2="360" gradientUnits="userSpaceOnUse"><stop stop-color="#e7ddd0"/><stop offset="1" stop-color="#e2c7b2"/></linearGradient>
            <linearGradient id="window-light" x1="172" y1="130" x2="318" y2="340" gradientUnits="userSpaceOnUse"><stop stop-color="#f4e8ce"/><stop offset="1" stop-color="#dfc29d"/></linearGradient>
            <clipPath id="back-clip"><path d="M265 64h181v220H265z"/></clipPath>
            <clipPath id="front-clip"><path d="M102 130h220v238H102z"/></clipPath>
          </defs>

          <!-- 铅笔圆弧与纸面刻度。 -->
          <path d="M75 293C29 187 122 54 266 45M456 132c57 71 42 180-31 232" stroke="#dcd3c7" stroke-width="1" stroke-dasharray="3 7"/>
          <path d="M66 176h12m-6-6v12M459 346h10m-5-5v10" stroke="#b6a186" stroke-width="1.3"/>
          <path d="m426 41 3.5 10.5L440 55l-10.5 3.5L426 69l-3.5-10.5L412 55l10.5-3.5L426 41Z" fill="#b89b70"/>
          <circle cx="115" cy="77" r="2.5" fill="#c2a78a"/>
          <ellipse cx="285" cy="437" rx="174" ry="14" fill="#e8e0d5" opacity=".45"/>

          <!-- 后侧相纸：安静的花园。 -->
          <g transform="rotate(11 350 187)">
            <path d="M251 50h209v282H251z" fill="#fffdf8" stroke="#e4ddd2" filter="url(#paper-shadow)"/>
            <g clip-path="url(#back-clip)">
              <path d="M265 64h181v220H265z" fill="#e5e8dc"/>
              <circle cx="403" cy="109" r="24" fill="#f4edd9"/>
              <path d="M265 218c37-16 47-77 94-58 40 15 66 4 87-15v139H265V218Z" fill="#bac2a9"/>
              <path d="M265 252c44-19 74 9 100-10 39-27 55-19 81-16v58H265v-32Z" fill="#929e85"/>
              <path d="M313 287c-5-58 5-117 42-175m-28 97c-28-5-34-22-35-39 21 4 34 18 35 39Zm13-34c-9-25-2-42 13-51 6 21 2 39-13 51Zm-21 64c-29-5-42-18-44-38 25 0 42 15 44 38Zm20-59c29 0 43-12 49-29-25-5-43 9-49 29Zm-13 37c34 0 46-10 56-29-30-6-47 10-56 29Z" stroke="#6b7b62" fill="#839477" stroke-width="1.4" stroke-linejoin="round"/>
            </g>
            <path d="M294 307h70" stroke="#c7b9a6" stroke-width="1"/>
            <text x="389" y="311" fill="#8a7c6a" font-family="Georgia, serif" font-size="11" font-style="italic">a quiet day</text>
          </g>

          <!-- 前侧相纸：通往下一页的拱门。 -->
          <g transform="rotate(-8 217 255)">
            <path d="M87 114h250v310H87z" fill="#fffdf8" stroke="#e2dacd" filter="url(#paper-shadow)"/>
            <g clip-path="url(#front-clip)">
              <path d="M102 130h220v238H102z" fill="url(#sky)"/>
              <path d="M114 368V246a98 98 0 0 1 196 0v122H114Z" fill="#c19d83"/>
              <path d="M132 368V247a80 80 0 0 1 160 0v121H132Z" fill="#ead7bd"/>
              <path d="M147 368V249a65 65 0 0 1 130 0v119H147Z" fill="url(#window-light)"/>
              <path d="M147 320c44-17 75-14 130-38v86H147v-48Z" fill="#aeb49a"/>
              <path d="M147 343c44-26 82-2 130-31v56H147v-25Z" fill="#7f8d76"/>
              <path d="m208 315-35 53h72l-25-55" fill="#e5d1ae"/>
              <path d="M102 352h45v16h-45zm175 0h45v16h-45Z" fill="#ad8972"/>
              <path d="M102 347h45m130 0h45M112 259h20m-15-38 18 5m-1-41 15 11m15-41 8 17m40-25v17m48-5-9 16m34 14-14 11m29 30-18 4m20 34h-20" stroke="#e9d5bc" stroke-width="1.3" opacity=".65"/>
              <path d="M113 370c2-35-3-52-11-72m11 46c16-6 19-17 17-29-12 4-17 15-17 29Zm-6-24c-12-1-19-11-18-20 12 0 18 8 18 20Z" stroke="#687b63" fill="#87937a" stroke-width="2"/>
            </g>
            <text x="113" y="401" fill="#8c7865" font-family="Georgia, serif" font-size="14" font-style="italic">to be continued.</text>
            <path d="M299 391c-7-6-12 3 0 9 12-6 7-15 0-9Z" fill="#883e4a" opacity=".8"/>
            <path d="m174 99 66 5-3 29-66-5 3-29Z" fill="#e0d5b9" fill-opacity=".65"/>
            <path d="m174 99 3 4-4 4 4 4-4 4 4 4-4 5 2 4m65-24-4 4 3 4-3 4 3 4-3 4 2 5" stroke="#f3ecdb" stroke-opacity=".8"/>
          </g>

          <!-- 画笔与手写告示。 -->
          <g transform="rotate(25 409 333)">
            <path d="M405 250h8v146a4 4 0 0 1-8 0V250Z" fill="#92694f"/>
            <path d="M405 255h8v21h-8z" fill="#bdab91"/>
            <path d="M405 255c-3-15-4-25 4-35 7 11 8 19 4 35h-8Z" fill="#665e50"/>
            <path d="M407 237c-1-6 1-12 2-15" stroke="#a39985" stroke-width="1"/>
          </g>
          <g transform="rotate(5 382 378)">
            <path d="M319 343h147v80H319z" fill="#f1eadc" stroke="#e2d7c6" filter="url(#paper-shadow)"/>
            <circle cx="331" cy="354" r="1.5" fill="#c3b49d"/>
            <path d="M331 355c-2-11-1-20 5-26" stroke="#b7a48a" stroke-width="1"/>
            <text x="392" y="378" text-anchor="middle" fill="#883e4a" font-family="'Songti SC', SimSun, serif" font-size="17" letter-spacing="4">暂时休馆</text>
            <path d="M346 389h92" stroke="#d3c3b0" stroke-width=".8"/>
            <text x="392" y="407" text-anchor="middle" fill="#786b5c" font-family="Georgia, serif" font-size="10" letter-spacing="2">SEE YOU SOON</text>
          </g>
        </svg>
        <figcaption><span aria-hidden="true"></span>A little pause, with love.<span aria-hidden="true"></span></figcaption>
      </figure>
    </section>
  </main>

  <footer class="footer">
    <p>我们之间<span class="small-heart" aria-hidden="true">♡</span>把平凡的日子，收藏成喜欢的样子。</p>
    <p class="footer-english" lang="en">Our days, our little gallery.</p>
  </footer>
</body>
</html>
