<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备适配中转</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #fdfcf8 0%, #f7f5f1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3d3935;
        }
        .container {
            text-align: center;
            padding: 40px 20px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(201, 162, 75, 0.2);
            border-top-color: #c9a24b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 24px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        p {
            font-size: 14px;
            color: #8b8176;
            line-height: 1.6;
        }
        .device-info {
            margin-top: 20px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 8px;
            font-size: 13px;
            color: #6b6157;
        }
    </style>
    <script src="assets/js/device-router.js?v=20261003"></script>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>正在适配设备…</h1>
        <p>根据你的设备类型跳转到最佳界面</p>
        <div class="device-info" id="deviceInfo">检测中…</div>
    </div>

    <script>
        // 显示设备信息
        const deviceType = DeviceRouter.detectDeviceType();
        const preference = DeviceRouter.getUserPreference();
        const targetType = DeviceRouter.getCurrentDeviceType();
        
        document.getElementById('deviceInfo').innerHTML = `
            检测到：${deviceType === 'desktop' ? '桌面设备' : '移动设备'}<br>
            ${preference ? `用户偏好：${preference === 'desktop' ? '桌面版' : '移动版'}<br>` : ''}
            跳转至：${targetType === 'desktop' ? '桌面端' : '移动端'}
        `;

        // 自动跳转（延迟300ms让用户看到提示）
        setTimeout(() => {
            DeviceRouter.routeAfterLogin();
        }, 300);
    </script>
</body>
</html>
