<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- M03: 相册目录与双列照片流 (规范画板: 390 x 844 CSS px) -->
  <defs>
    <style>
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-weight: 600; fill: #252422; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-weight: 400; fill: #252422; }
      .text-serif { font-family: "Noto Serif SC", "Songti SC", SimSun, serif; font-weight: 500; fill: #252422; }
      .text-muted { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-weight: 400; fill: #68635E; }
      .text-accent { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-weight: 600; fill: #883E4A; }
      .text-btn { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-weight: 600; fill: #FFFFFF; }
    </style>
    <clipPath id="albumP1">
      <rect x="20" y="240" width="170" height="212" rx="4"/>
    </clipPath>
    <clipPath id="albumP2">
      <rect x="200" y="240" width="170" height="212" rx="4"/>
    </clipPath>
    <clipPath id="albumP3">
      <rect x="20" y="508" width="170" height="212" rx="4"/>
    </clipPath>
    <clipPath id="albumP4">
      <rect x="200" y="508" width="170" height="212" rx="4"/>
    </clipPath>
  </defs>

  <!-- 页面暖白底色: #F7F5F1 -->
  <rect width="390" height="844" fill="#F7F5F1"/>

  <!-- 1. 模拟状态栏 -->
  <g id="StatusBar">
    <text x="32" y="32" class="text-title" font-size="14" font-weight="600">09:41</text>
    <path d="M335 22h3v10h-3zm5-3h3v13h-3zm5-3h3v16h-3z" fill="#252422"/>
    <rect x="350" y="21" width="22" height="12" rx="3" stroke="#252422" stroke-width="1.8" fill="none"/>
    <rect x="352" y="23" width="14" height="8" rx="1.5" fill="#252422"/>
  </g>

  <!-- 2. 顶栏 (相册标题 + 上传按钮) -->
  <g id="TopBar">
    <text x="20" y="86" class="text-title" font-size="22">相册</text>
    <rect x="286" y="65" width="84" height="34" rx="6" fill="#883E4A"/>
    <text x="328" y="87" class="text-btn" font-size="13" text-anchor="middle">上传照片</text>
  </g>

  <!-- 3. 面包屑路径层级 (规范 7.2) -->
  <g id="Breadcrumbs" transform="translate(20, 118)">
    <text x="0" y="0" class="text-muted" font-size="13">全部</text>
    <text x="30" y="0" class="text-muted" font-size="13">/</text>
    <text x="42" y="0" class="text-muted" font-size="13">2026年</text>
    <text x="92" y="0" class="text-muted" font-size="13">/</text>
    <text x="104" y="0" class="text-title" font-size="13">厦门旅行</text>
  </g>

  <!-- 4. 文件夹胶囊横滑列表 (Folder Pills) -->
  <g id="FolderPills" transform="translate(20, 134)">
    <!-- 激活文件夹: 厦门旅行 (24) -->
    <rect x="0" y="0" width="124" height="36" rx="8" fill="#F1E4E6" stroke="#883E4A" stroke-width="1"/>
    <!-- 文件夹图标 -->
    <path d="M14 14a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 1 14V7a1.5 1.5 0 0 1 1.5-1.5h3.5l1.5 2h5A1.5 1.5 0 0 1 14 9z" transform="translate(10, 8)" fill="none" stroke="#883E4A" stroke-width="1.4"/>
    <text x="36" y="23" class="text-accent" font-size="12">厦门旅行 (24)</text>

    <!-- 文件夹: 日常生活 (68) -->
    <rect x="132" y="0" width="124" height="36" rx="8" fill="#FFFEFC" stroke="#DED9D2" stroke-width="1"/>
    <path d="M14 14a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 1 14V7a1.5 1.5 0 0 1 1.5-1.5h3.5l1.5 2h5A1.5 1.5 0 0 1 14 9z" transform="translate(142, 8)" fill="none" stroke="#68635E" stroke-width="1.4"/>
    <text x="168" y="23" class="text-body" font-size="12">日常生活 (68)</text>

    <!-- 文件夹: 猫咪日记 (19) -->
    <rect x="264" y="0" width="106" height="36" rx="8" fill="#FFFEFC" stroke="#DED9D2" stroke-width="1"/>
    <text x="282" y="23" class="text-body" font-size="12">猫咪日记 (19)</text>
  </g>

  <!-- 5. 标签筛选条 (全部、风景、美食、人像) -->
  <g id="TagFilters" transform="translate(20, 190)">
    <!-- 选中标签: 全部 -->
    <rect x="0" y="0" width="48" height="26" rx="13" fill="#252422"/>
    <text x="24" y="17" class="text-btn" font-size="12" text-anchor="middle">全部</text>

    <!-- 标签: 风景 -->
    <rect x="56" y="0" width="48" height="26" rx="13" fill="#EFECE6"/>
    <text x="80" y="17" class="text-muted" font-size="12" text-anchor="middle">风景</text>

    <!-- 标签: 美食 -->
    <rect x="112" y="0" width="48" height="26" rx="13" fill="#EFECE6"/>
    <text x="136" y="17" class="text-muted" font-size="12" text-anchor="middle">美食</text>

    <!-- 标签: 抓拍 -->
    <rect x="168" y="0" width="48" height="26" rx="13" fill="#EFECE6"/>
    <text x="192" y="17" class="text-muted" font-size="12" text-anchor="middle">抓拍</text>
  </g>

  <!-- 6. 双列 4:5 比例照片流 (Row 1) -->
  <g id="PhotoGridRow1">
    <!-- 图1: 落日余晖 -->
    <g clip-path="url(#albumP1)">
      <rect x="20" y="240" width="170" height="212" fill="#d9745b"/>
      <circle cx="105" cy="330" r="35" fill="#f8d07e"/>
      <rect x="20" y="380" width="170" height="72" fill="#2d3748"/>
    </g>
    <text x="20" y="472" class="text-title" font-size="14">海边落日余晖</text>
    <text x="20" y="490" class="text-muted" font-size="12">2026.09.28</text>

    <!-- 图2: 老巷手冲咖啡 -->
    <g clip-path="url(#albumP2)">
      <rect x="200" y="240" width="170" height="212" fill="#cfc2b2"/>
      <rect x="240" y="300" width="90" height="80" rx="4" fill="#8d7765"/>
      <rect x="255" y="315" width="60" height="50" fill="#f3efe8"/>
    </g>
    <text x="200" y="472" class="text-title" font-size="14">老巷手冲咖啡</text>
    <text x="200" y="490" class="text-muted" font-size="12">2026.09.21</text>
  </g>

  <!-- 7. 双列 4:5 比例照片流 (Row 2) -->
  <g id="PhotoGridRow2">
    <!-- 图3: 植物园温室 -->
    <g clip-path="url(#albumP3)">
      <rect x="20" y="508" width="170" height="212" fill="#a3b18a"/>
      <path d="M105 690 Q85 620 55 600 Q95 630 105 690" fill="#344e41"/>
      <path d="M105 690 Q125 610 155 590 Q115 630 105 690" fill="#588157"/>
    </g>
    <text x="20" y="740" class="text-title" font-size="14">植物园温室</text>
    <text x="20" y="758" class="text-muted" font-size="12">2026.09.18</text>

    <!-- 图4: 白色灯塔远景 -->
    <g clip-path="url(#albumP4)">
      <rect x="200" y="508" width="170" height="212" fill="#8da9c4"/>
      <polygon points="275,690 295,690 290,590 280,590" fill="#eef4f8"/>
      <rect x="279" y="580" width="12" height="10" fill="#883e4a"/>
    </g>
    <text x="200" y="740" class="text-title" font-size="14">白色灯塔远景</text>
    <text x="200" y="758" class="text-muted" font-size="12">2026.09.12</text>
  </g>

  <!-- 8. 稳定四栏底部导航 (相册激活) -->
  <g id="BottomNavigation">
    <rect y="776" width="390" height="68" fill="#FFFEFC"/>
    <line x1="0" y1="776" x2="390" y2="776" stroke="#DED9D2" stroke-width="1"/>

    <!-- Tab 1: 日常 -->
    <g transform="translate(48, 786)">
      <path d="M-9 14l9-7 9 7v10a2 2 0 0 1-2 2h-14a2 2 0 0 1-2-2z" fill="none" stroke="#68635E" stroke-width="1.8"/>
      <text x="0" y="32" class="text-muted" font-size="11" text-anchor="middle">日常</text>
    </g>

    <!-- Tab 2: 相册 (激活酒红) -->
    <g transform="translate(146, 786)">
      <rect x="-9" y="3" width="18" height="15" rx="2" fill="none" stroke="#883E4A" stroke-width="1.8"/>
      <circle cx="-3" cy="8" r="1.5" fill="#883E4A"/>
      <polyline points="7 14 3 9 -5 18" stroke="#883E4A" stroke-width="1.6" fill="none"/>
      <text x="0" y="32" class="text-accent" font-size="11" text-anchor="middle">相册</text>
    </g>

    <!-- Tab 3: 心愿 -->
    <g transform="translate(244, 786)">
      <path d="M5.8 4.6a4.5 4.5 0 0 0-6.3 0L0 5.1l-.5-.5a4.5 4.5 0 0 0-6.3 6.3l.5.5L0 17.5l6.3-6.1.5-.5a4.5 4.5 0 0 0 0-6.3z" transform="translate(0, 1)" fill="none" stroke="#68635E" stroke-width="1.7"/>
      <text x="0" y="32" class="text-muted" font-size="11" text-anchor="middle">心愿</text>
    </g>

    <!-- Tab 4: 我们 -->
    <g transform="translate(342, 786)">
      <path d="M6 18v-2a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0-6 16v2" fill="none" stroke="#68635E" stroke-width="1.8"/>
      <circle cx="0" cy="5" r="3.5" fill="none" stroke="#68635E" stroke-width="1.8"/>
      <text x="0" y="32" class="text-muted" font-size="11" text-anchor="middle">我们</text>
    </g>
  </g>
</svg>
