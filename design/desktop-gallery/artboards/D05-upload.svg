</defs><rect x="0" y="0" width="1440" height="960" rx="0" fill="#F7F5F1" /><rect x="0" y="0" width="1440" height="80" rx="0" fill="#F7F5F1" /><path d="M0 79.5L1440 79.5" fill="none" stroke="#DED9D2"/><text x="160" y="48" font-size="22" fill="#252422" class="serif">我们之间</text><text x="1280" y="48" font-size="16" fill="#68635E" text-anchor="end">上传照片</text><text x="160" y="130" font-size="14" fill="#883E4A" >‹  返回相册</text><text x="160" y="180" font-size="32" fill="#252422" class="serif">上传照片</text><text x="160" y="212" font-size="14" fill="#68635E" >先确认目的地，再把新的片段留在这里。</text><rect x="160" y="248" width="704" height="138" rx="8" fill="#FFFEFC" stroke="#938B83" stroke-dasharray="5 5"/><text x="184" y="290" font-size="20" fill="#252422" >把照片拖到这里，或选择文件</text><text x="184" y="325" font-size="14" fill="#68635E" >支持格式、大小与数量按站点实际限制显示</text><rect x="712" y="286" width="128" height="44" rx="8" fill="#883E4A" /><text x="776" y="314" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="500">选择照片</text><text x="160" y="436" font-size="20" fill="#252422" font-weight="600">已选照片</text><text x="864" y="436" font-size="14" fill="#68635E" text-anchor="end">1 张已上传 · 1 张上传中 · 1 张失败</text><path d="M160 460L864 460" fill="none" stroke="#DED9D2"/><svg x="160" y="476" width="72" height="80" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid slice" style="border-radius:4px;overflow:hidden"><use href="#coast"/></svg><text x="252" y="498" font-size="16" fill="#252422" >海边的下午.jpg</text><text x="252" y="526" font-size="14" fill="#68635E" >2.1 MB · 已保存到目标目录</text><text x="864" y="498" font-size="14" fill="#34634B" text-anchor="end">已上传</text><path d="M160 588L864 588" fill="none" stroke="#DED9D2"/><svg x="160" y="604" width="72" height="80" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid slice" style="border-radius:4px;overflow:hidden"><use href="#coffee"/></svg><text x="252" y="626" font-size="16" fill="#252422" >街角的咖啡.jpg</text><text x="252" y="654" font-size="14" fill="#68635E" >示例进度：1.8 MB / 2.6 MB · 69%</text><text x="864" y="626" font-size="14" fill="#795318" text-anchor="end">上传中</text><rect x="252" y="671" width="480" height="4" rx="2" fill="#EFECE6" /><rect x="252" y="671" width="331.2" height="4" rx="2" fill="#883E4A" /><path d="M160 716L864 716" fill="none" stroke="#DED9D2"/><svg x="160" y="732" width="72" height="80" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid slice" style="border-radius:4px;overflow:hidden"><use href="#street"/></svg><text x="252" y="754" font-size="16" fill="#252422" >一起走过的街道.jpg</text><text x="252" y="782" font-size="14" fill="#68635E" >网络中断 · 这张照片尚未确认上传成功</text><text x="864" y="754" font-size="14" fill="#AA303C" text-anchor="end">失败</text><rect x="792" y="772" width="72" height="44" rx="8" fill="#FFFEFC" stroke="#938B83"/><text x="828" y="800" font-size="16" fill="#252422" text-anchor="middle" font-weight="500">重试</text><path d="M896 248L1280 248" fill="none" stroke="#DED9D2"/><text x="896" y="290" font-size="18" fill="#252422" font-weight="600">目标目录</text><rect x="896" y="311" width="384" height="76" rx="8" fill="#FFFEFC" stroke="#938B83"/><text x="912" y="339" font-size="16" fill="#252422" >全部照片 / 2026年 / 厦门旅行</text><text x="912" y="368" font-size="14" fill="#883E4A" >更改目录</text><text x="896" y="425" font-size="14" fill="#68635E" >从相册进入，默认使用当前目录。</text><text x="896" y="453" font-size="14" fill="#68635E" >已上传项会保留，不会随重试再次上传。</text><rect x="896" y="495" width="384" height="100" rx="8" fill="#F6EEDC" /><text x="912" y="530" font-size="16" fill="#795318" >上传尚未全部完成</text><text x="912" y="562" font-size="14" fill="#795318" >失败项可单独重试，其他文件继续处理。</text><rect x="896" y="627" width="384" height="44" rx="8" fill="#FFFEFC" stroke="#938B83"/><text x="1088" y="655" font-size="16" fill="#252422" text-anchor="middle" font-weight="500">返回相册核对结果</text><text x="896" y="709" font-size="14" fill="#68635E" >关闭页面与取消传输是不同的操作。</text><text x="896" y="737" font-size="14" fill="#68635E" >当前队列仅用于说明状态与恢复布局。</text><text x="32" y="946" font-size="12" fill="#68635E" >D05 · 1440 × 960 · 静态设计稿 / 全部内容为模拟</text></svg>