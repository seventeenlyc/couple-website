 >记得说一句生日快乐</text><path d="M280 631L800 631" fill="none" stroke="#DED9D2"/><text x="280" y="676" font-size="22" fill="#252422" class="serif">11.09</text><text x="392" y="676" font-size="18" fill="#252422" >小鹿的生日</text><text x="392" y="706" font-size="14" fill="#68635E" >把这一天留给彼此</text><path d="M280 729L800 729" fill="none" stroke="#DED9D2"/><text x="848" y="434" font-size="18" fill="#252422" >我们的故事</text><text x="848" y="463" font-size="14" fill="#68635E" >按时间翻看照片与文字</text><path d="M0 0l6 6-6 6" transform="translate(1144 422)" fill="none" stroke="#68635E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M848 485L1160 485" fill="none" stroke="#DED9D2"/><text x="848" y="532" font-size="18" fill="#252422" >私密空间</text><text x="848" y="561" font-size="14" fill="#68635E" >验证后进入自己的笔记与文件</text><path d="M0 0l6 6-6 6" transform="translate(1144 520)" fill="none" stroke="#68635E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M848 583L1160 583" fill="none" stroke="#DED9D2"/><text x="848" y="630" font-size="18" fill="#252422" >安全与设备</text><text x="848" y="659" font-size="14" fill="#68635E" >查看授权与设备状态</text><path d="M0 0l6 6-6 6" transform="translate(1144 618)" fill="none" stroke="#68635E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M848 681L1160 681" fill="none" stroke="#DED9D2"/><text x="848" y="728" font-size="18" fill="#252422" >账户设置</text><text x="848" y="757" font-size="14" fill="#68635E" >已有设置与退出入口</text><path d="M0 0l6 6-6 6" transform="translate(1144 716)" fill="none" stroke="#68635E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M848 779L1160 779" fill="none" stroke="#DED9D2"/><text x="280" y="878" font-size="14" fill="#68635E" >人物、日期与文案均为模拟示例；真实页面使用现有配置与记录。</text><text x="32" y="946" font-size="12" fill="#68635E" >D09 · 1440 × 960 · 静态设计稿 / 全部内容为模拟</text></svg>