<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备路由测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
            background: #f7f5f1;
            padding: 40px 20px;
            color: #3d3935;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        h1 { font-size: 24px; margin-bottom: 8px; }
        .status {
            background: #fef9f3;
            border: 1px solid #e8dfd5;
            padding: 16px;
            border-radius: 8px;
            margin: 20px 0;
            font-size: 14px;
            line-height: 1.8;
        }
        .status strong { color: #c9a24b; }
        button {
            width: 100%;
            padding: 14px 20px;
            margin: 8px 0;
            border: 1px solid #d9cfc3;
            border-radius: 8px;
            background: white;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        button:hover {
            background: #f7f5f1;
            border-color: #c9a24b;
        }
        button.primary {
            background: #3d3935;
            color: white;
            border-color: #3d3935;
        }
        button.primary:hover {
            background: #544139;
        }
        .section {
            margin: 24px 0;
            padding-top: 24px;
            border-top: 1px solid #e8dfd5;
        }
        .section:first-child { border-top: none; padding-top: 0; }
        h2 { font-size: 16px; margin-bottom: 12px; color: #6b6157; }
    </style>
    <script src="assets/js/device-router.js?v=20261003"></script>
</head>
<body>
    <div class="container">
        <h1>🧭 设备路由测试工具</h1>
        <p style="color: #8b8176; margin-bottom: 20px;">测试统一入口的设备自动分流与手动切换功能</p>

        <div class="status" id="statusDisplay">
            <div><strong>当前视口宽度：</strong><span id="viewportWidth">-</span>px</div>
            <div><strong>自动检测设备：</strong><span id="detectedDevice">-</span></div>
            <div><strong>用户手动偏好：</strong><span id="userPreference">-</span></div>
            <div><strong>最终目标页面：</strong><span id="targetPage">-</span></div>
        </div>

        <div class="section">
            <h2>模拟登录后跳转</h2>
            <button class="primary" onclick="simulateLogin()">🚀 执行登录后路由（根据设备自动分流）</button>
        </div>

        <div class="section">
            <h2>手动切换设备版本</h2>
            <button onclick="switchToDesktop()">💻 切换到桌面版（并记住）</button>
            <button onclick="switchToMobile()">📱 切换到移动版（并记住）</button>
            <button onclick="resetAuto()">🔄 重置为自动检测</button>
        </div>

        <div class="section">
            <h2>直接访问测试</h2>
            <button onclick="goToDesktop()">前往桌面端页面</button>
            <button onclick="goToMobile()">前往移动端页面</button>
            <button onclick="goToLogin()">返回登录页</button>
        </div>
    </div>

    <script>
        function updateStatus() {
            const detected = DeviceRouter.detectDeviceType();
            const preference = DeviceRouter.getUserPreference();
            const target = DeviceRouter.getCurrentDeviceType();
            const width = window.innerWidth;

            document.getElementById('viewportWidth').textContent = width;
            document.getElementById('detectedDevice').textContent = detected === 'desktop' ? '桌面设备' : '移动设备';
            document.getElementById('userPreference').textContent = preference 
                ? (preference === 'desktop' ? '桌面版（已记忆）' : '移动版（已记忆）')
                : '无（跟随自动检测）';
            document.getElementById('targetPage').textContent = target === 'desktop' ? '/desktop/index.html' : '/h5/index.html';
        }

        function simulateLogin() {
            alert('即将执行登录后路由，根据设备类型自动跳转...');
            DeviceRouter.routeAfterLogin();
        }

        function switchToDesktop() {
            if (confirm('切换到桌面版并记住选择？')) {
                DeviceRouter.switchTo('desktop', true);
            }
        }

        function switchToMobile() {
            if (confirm('切换到移动版并记住选择？')) {
                DeviceRouter.switchTo('mobile', true);
            }
        }

        function resetAuto() {
            if (confirm('清除手动偏好，恢复自动检测？')) {
                DeviceRouter.resetToAuto();
            }
        }

        function goToDesktop() {
            window.location.href = '/desktop/index.html';
        }

        function goToMobile() {
            window.location.href = '/h5/index.html';
        }

        function goToLogin() {
            window.location.href = '/index.html';
        }

        // 初始化
        updateStatus();

        // 监听窗口变化
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(updateStatus, 200);
        });
    </script>
</body>
</html>
