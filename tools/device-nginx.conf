# Site-specific include. Public endpoints are selected by device-gateway.php.
location = / {
    try_files /index.html =404;
    add_header Cache-Control "no-store" always;
}
location = /index.html {
    try_files /index.html =404;
    add_header Cache-Control "no-store" always;
}
location = /device-login.php { return 302 /index.html; }
location = /maintaining.html {
    # Legacy clients probe this URL with HEAD and follow redirects.
    # 410 avoids the site's 404 error-page redirect back to login.
    try_files /maintaining.html =410;
    add_header Cache-Control "no-store" always;
}
location ^~ /assets/ {
    if ($uri ~* "\.(php[0-9]*|phtml|phar|ini|json|bak|sql)$") { return 404; }
    try_files $uri =404;
}
location ^~ /_device_files/ {
    internal;
    alias /www/wwwroot/lyczwc520.site/;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
location / {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /www/wwwroot/lyczwc520.site/device-gateway.php;
    fastcgi_param SCRIPT_NAME /device-gateway.php;
    fastcgi_param PHP_ADMIN_VALUE "open_basedir=/www/wwwroot/lyczwc520.site/:/tmp/:/www/wwwroot/.couple-device-state/lyczwc520.site/";
    fastcgi_pass unix:/tmp/php-cgi-82.sock;
}
