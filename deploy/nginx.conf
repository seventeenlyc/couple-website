# Nginx reverse proxy configuration for Node.js / Fastify backend

server {
    listen 80;
    server_name lyczwc520.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lyczwc520.site;

    ssl_certificate /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /www/wwwroot/lyczwc520.site;

    # Public static assets
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
    }

    location = /maintaining.html {
        try_files /maintaining.html =410;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /assets/ {
        if ($uri ~* "\.(php[0-9]*|phtml|phar|ini|json|bak|sql)$") { return 404; }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Protected internal files served via X-Accel-Redirect from Node
    location ^~ /_device_files/ {
        internal;
        alias /www/wwwroot/lyczwc520.site/;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Block direct web access to sensitive directories
    location ~ ^/(data|server|tests|tools|\.git|\.env) {
        return 404;
    }

    # Pass all API and protected HTML / uploads to Node.js backend
    location / {
        proxy_pass http://127.0.0.1:19085;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward buffering & timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
