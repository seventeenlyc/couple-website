<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我们之间 · 生活画廊</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f7f5f1;
      --surface: #fffefc;
      --ink: #252422;
      --muted: #68635e;
      --accent: #883e4a;
      --divider: #ded9d2;
      --serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
      --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--canvas); font-family: var(--sans); }
    a { color: inherit; }
    .page { max-width: 1120px; min-height: 100vh; margin: auto; padding: 0 40px; display: flex; flex-direction: column; }
    .masthead { min-height: 102px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--divider); }
    .brand { display: inline-flex; align-items: center; gap: 13px; text-decoration: none; }
    .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--accent); border-radius: 50%; color: var(--accent); font-family: var(--serif); font-size: 20px; line-height: 1; }
    .brand-name { font-family: var(--serif); font-size: 20px; font-weight: 600; letter-spacing: .08em; }
    .masthead-note { color: var(--muted); font-size: 12px; letter-spacing: .14em; }
    main { flex: 1; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(300px, .9fr); align-items: center; gap: clamp(40px, 8vw, 112px); padding: 72px 0 96px; }
    .intro { max-width: 560px; }
    .eyebrow { display: flex; align-items: center; gap: 13px; margin: 0 0 25px; color: var(--accent); font-size: 12px; font-weight: 600; letter-spacing: .24em; }
    .eyebrow::before { content: ""; width: 28px; height: 1px; background: currentColor; }
    h1 { margin: 0; font-family: var(--serif); font-size: clamp(42px, 5vw, 68px); font-weight: 500; line-height: 1.34; letter-spacing: .03em; }
    h1 span { color: var(--accent); }
    .intro p:last-child { max-width: 390px; margin: 28px 0 0; color: var(--muted); font-size: 16px; line-height: 1.9; }
    .choices { padding: 34px; background: var(--surface); border: 1px solid var(--divider); border-radius: 12px; box-shadow: 0 16px 40px rgba(37, 36, 34, .045); }
    .choices-title { margin: 0 0 19px; color: var(--muted); font-size: 13px; letter-spacing: .06em; }
    .choice { min-height: 102px; padding: 21px 23px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border: 1px solid var(--divider); border-radius: 8px; text-decoration: none; transition: border-color .18s ease, background-color .18s ease, transform .18s ease; }
    .choice + .choice { margin-top: 12px; }
    .choice:hover { border-color: var(--accent); background: #fbf7f7; transform: translateY(-2px); }
    .choice:focus-visible, .brand:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .choice strong { display: block; margin-bottom: 6px; font-family: var(--serif); font-size: 21px; font-weight: 600; }
    .choice small { display: block; color: var(--muted); font-size: 13px; }
    .choice-arrow { color: var(--accent); font-size: 23px; font-weight: 300; line-height: 1; }
    footer { min-height: 66px; display: flex; align-items: center; border-top: 1px solid var(--divider); color: var(--muted); font-size: 12px; letter-spacing: .04em; }
    @media (max-width: 720px) {
      .page { padding: 0 22px; }
      .masthead { min-height: 76px; }
      .brand-name { font-size: 18px; }
      .masthead-note { display: none; }
      main { grid-template-columns: 1fr; gap: 48px; align-content: center; padding: 56px 0 68px; }
      h1 { font-size: clamp(38px, 10vw, 54px); }
      .intro p:last-child { margin-top: 20px; font-size: 15px; }
      .choices { padding: 20px; }
      .choice { min-height: 88px; padding: 17px 19px; }
    }
    @media (prefers-reduced-motion: reduce) { .choice { transition: none; } }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <a class="brand" href="/" aria-label="我们之间，返回导引页"><span class="brand-mark" aria-hidden="true">♡</span><span class="brand-name">我们之间</span></a>
      <span class="masthead-note">生活画廊</span>
    </header>
    <main>
      <section class="intro" aria-labelledby="intro-title">
        <p class="eyebrow">生活画廊</p>
        <h1 id="intro-title">我们的日常，<br><span>从这里继续。</span></h1>
        <p>选择适合当前设备的界面，进入相册、心愿和一起写下的故事。</p>
      </section>
      <nav class="choices" aria-label="选择浏览界面">
        <p class="choices-title">请选择进入方式</p>
        <a class="choice" href="/h5/index.html"><span><strong>移动端</strong><small>适合手机与小屏幕</small></span><span class="choice-arrow" aria-hidden="true">↗</span></a>
        <a class="choice" href="/desktop/index.html"><span><strong>桌面端</strong><small>适合电脑与宽屏幕</small></span><span class="choice-arrow" aria-hidden="true">↗</span></a>
      </nav>
    </main>
    <footer>留住平常的每一天。</footer>
  </div>
</body>
</html>
